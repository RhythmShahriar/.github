name: ci
on:
  pull_request:
jobs:
  commitlint:
    uses: ./.github/workflows/commitlint.yml
  pinned-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: pinned actions
        # The shared workflows must pin every action they use to a full
        # commit SHA, as they ask of the repositories that call them.
        run: |
          bad=$(grep -nE '^[[:space:]-]*uses:' .github/workflows/*.y*ml \
            | grep -vE 'uses:[[:space:]]*"?(\./|RhythmShahriar/\.github/)' \
            | grep -vE '@[0-9a-f]{40}"?([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "These uses: lines don't pin a 40-hex commit SHA:"
            echo "$bad"
            exit 1
          fi
  scripts:
    # The shared scripts and these workflows are checked here too: the
    # kit-pin tests under sh and dash, shellcheck and a pinned actionlint.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      ACTIONLINT: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: check-kit-pin tests (sh)
        run: sh scripts/check-kit-pin_test.sh
      - name: check-kit-pin tests (dash)
        run: dash scripts/check-kit-pin_test.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh .githooks/commit-msg
      - name: actionlint
        run: go run "$ACTIONLINT"
