# Reusable release: GoReleaser builds every platform, publishes a GitHub
# release with checksums.txt and signs it with keyless cosign. Every action
# and tool is pinned to an exact version (actions by commit SHA), so a moved
# tag upstream can't change what signs a release.
#   on:
#     push:
#       tags: ["v*"]
#   jobs:
#     release:
#       uses: RhythmShahriar/.github/.github/workflows/release-go.yml@master
#       permissions:
#         contents: write
#         id-token: write
#         attestations: write
#
# Every caller must grant all three permissions: GitHub refuses to start a
# reusable workflow that asks for more than its caller allows.
#
# Besides the cosign bundle, the release gets GitHub artifact attestations
# (SLSA build provenance) for checksums.txt, every archive, SBOM and Linux
# package, so anyone with gh can verify without cosign:
#   gh attestation verify checksums.txt --repo RhythmShahriar/<repo> \
#     --signer-workflow RhythmShahriar/.github/.github/workflows/release-go.yml \
#     --source-ref refs/tags/v<version> --deny-self-hosted-runners
# Always pass --source-ref: a snapshot dry run dispatched from a branch is
# attested by this same workflow, so without it a file built from any
# branch would verify too.
#
# Package managers: a caller that publishes a Homebrew cask, Scoop manifest
# or winget pull request passes a token that can push to those repositories:
#       secrets:
#         TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
# Its .goreleaser.yaml should skip those publishers when the token is empty
# (skip_upload: '{{ if not (index .Env "TAP_GITHUB_TOKEN") }}true{{ end }}').
#
# snapshot: true builds, signs and attests a snapshot (goreleaser release
# --snapshot) without publishing anything, for a dry run from a
# workflow_dispatch test workflow.
#
# The kit is a normal go.mod requirement: the release builds exactly the
# versions go.mod pins, never a checkout of rhythm master.
name: release-go
on:
  workflow_call:
    inputs:
      snapshot:
        description: Build a snapshot and skip publishing (a dry run).
        type: boolean
        default: false
    secrets:
      TAP_GITHUB_TOKEN:
        description: Token that can push to the Homebrew tap, Scoop bucket and winget-pkgs fork. Without it GoReleaser skips those publishers.
        required: false
permissions:
  contents: write
  id-token: write # keyless cosign signing and attestations
  attestations: write # gh attestation verify
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      # syft writes the SBOMs for a GoReleaser sboms: block. It is on PATH
      # for every caller; a config without sboms: never runs it.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
        with:
          syft-version: v1.54.1
      - name: Put syft on PATH
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: dirname "$SYFT" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.3
          args: release --clean ${{ inputs.snapshot && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          GOWORK: "off"
      # After GoReleaser, so the subjects are the exact files it published.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/checksums.txt
            dist/*.tar.gz
            dist/*.zip
            dist/*.sbom.json
            dist/*.deb
            dist/*.rpm
            dist/*.apk
