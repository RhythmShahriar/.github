# Keeps the SHA-pinned actions in the shared workflows current. Dependabot
# updates the SHA and the version comment after it together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
